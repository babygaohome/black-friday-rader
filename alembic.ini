# For `alembic revision --autogenerate -m "..."` and other alembic commands during development.
# The database URL comes from DEALRADAR_DATABASE_URL (see dealradar/core/config.py).
[alembic]
script_location = dealradar/migrations
file_template = %%(rev)s
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
