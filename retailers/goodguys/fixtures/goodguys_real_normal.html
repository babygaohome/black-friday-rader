ter if a fault is detected. It helps reduce the risk of overflow damage, but it is not a promise that every plumbing or installation issue is impossible."}},{"@type":"Question","name":"Is the Quick 1hr program enough for everyday dishes?","acceptedAnswer":{"@type":"Answer","text":"Yes, for many daily loads. The Quick 1hr program suits regular plates, cups and cutlery that are not heavily baked on, while tougher cookware is better matched to Pots and Pans or Auto Wash for a more thorough clean."}},{"@type":"Question","name":"Will the brushed steel finish show lots of fingerprints?","acceptedAnswer":{"@type":"Answer","text":"Bosch Series 4 uses a brushed steel anti-fingerprint finish. It can still pick up marks from regular handling, but it is designed to show them less readily than a plain polished stainless surface, which helps in busy family kitchens."}}]}</script>
