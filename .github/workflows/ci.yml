name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  # Same suite on real PostgreSQL + Redis, plus "migrations match the models" against a fresh database.
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dealradar
          POSTGRES_PASSWORD: dealradar
          POSTGRES_DB: dealradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dealradar" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DEALRADAR_TEST_DATABASE_URL: postgresql+asyncpg://dealradar:dealradar@localhost:5432/dealradar_test
      DEALRADAR_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Migrate a fresh database and check it matches the models
        env:
          PGPASSWORD: dealradar
          DEALRADAR_DATABASE_URL: postgresql+asyncpg://dealradar:dealradar@localhost:5432/dealradar_ci
        run: |
          psql -h localhost -U dealradar -d dealradar_test -c "CREATE DATABASE dealradar_ci"
          python -m dealradar.cli migrate
          alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
